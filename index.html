<header><div class="top"><div class="brand"><div class="logo">🍲</div><div><h1>HomeMaid</h1><small>Mon carnet de recettes</small></div></div><button class="btn" id="importBtn">Importer JSON</button><button class="btn" id="exportBtn">Exporter</button><button class="btn primary" id="newBtn">＋ Nouvelle recette</button><input id="fileInput" type="file" accept=".json,application/json" hidden></div></header>

function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}function id(){return 'r-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,8)}function toast(s){$('toast').textContent=s;$('toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.remove('show'),2800)}function save(){try{localStorage.setItem(KEY,JSON.stringify(recipes))}catch(e){toast('Stockage indisponible : exportez vos recettes.')}}

function openDetail(r){$('detailBody').innerHTML=`<div class="detail"><div><span class="device">${esc(r.category)}${r.device?' · '+esc(r.device):''}</span><h2>${esc(r.title)}</h2><p class="muted">${esc(r.description)}</p><div class="dmeta">Préparation : ${r.prepTime} min · Cuisson : ${r.cookTime} min</div><div class="servings">Pour <button class="btn small" id="minus">−</button><input class="field" id="portion" type="number" min="1" max="100" value="${r.servings}"><button class="btn small" id="plus">＋</button> personne(s)</div></div>${r.image?`<img src="${esc(r.image)}" alt="${esc(r.title)}">`:'<div class="thumb" style="height:180px;border-radius:12px">🍽️</div>'}</div><h3 class="sect">Ingrédients</h3><div class="ingredients" id="ingredients"></div><h3 class="sect">Préparation</h3><ol>${r.steps.map(x=>`<li>${esc(x)}</li>`).join('')}</ol><div class="actions"><button class="btn" id="print">Imprimer / PDF</button><button class="btn" id="edit">Modifier</button><button class="btn danger" id="del">Supprimer</button></div>`;function update(){let n=Math.max(1,Math.min(100,Number($('portion').value)||1));$('portion').value=n;$('ingredients').innerHTML=r.ingredients.length?r.ingredients.map(i=>`<div class="ing">${esc(i.name)} <b>${esc(qty(i,r.servings,n))}</b></div>`).join(''):'<span class="muted">Aucun ingrédient renseigné.</span>'}$('portion').oninput=update;$('minus').onclick=()=>{$('portion').value=Math.max(1,+$('portion').value-1);update()};$('plus').onclick=()=>{$('portion').value=Math.min(100,+$('portion').value+1);update()};update();$('print').onclick=()=>print();$('edit').onclick=()=>{close('detail');openForm(r)};$('del').onclick=()=>{if(confirm(`Supprimer « ${r.title} » ?`)){recipes=recipes.filter(x=>x.id!==r.id);save();render();close('detail');toast('Recette supprimée.')}};$('detail').classList.add('open')}
function close(x){$(x).classList.remove('open')}function addRow(x={name:'',amount:'',unit:'g'}){let d=document.createElement('div');d.className='ir';d.innerHTML=`<input placeholder="Ingrédient" aria-label="Ingrédient" value="${esc(x.name)}"><input type="number" min="0" step="any" placeholder="Qté" value="${x.amount??''}" aria-label="Quantité"><select aria-label="Unité">${['g','kg','ml','L','cl','pièce','gousse','c. à café','c. à soupe','pincée','au goût'].map(u=>`<option ${x.unit===u?'selected':''}>${u}</option>`).join('')}</select><button type="button" class="btn danger" aria-label="Retirer">×</button>`;d.querySelector('button').onclick=()=>d.remove();$('rows').append(d)}
